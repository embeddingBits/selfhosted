services:
  kavita:
    image: docker.io/jvmilazz0/kavita:latest
    container_name: kavita
    volumes:
      - /home/ebits/Documents/books:/books
      - /home/ebits/College/:/college_notes
      - ../../data/kavita/config:/kavita/config
    environment:
      - TZ=Asia/Kolkata
    ports:
      - "5000:5000"
    restart: unless-stopped
