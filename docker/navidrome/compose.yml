services:
  navidrome:
    image: docker.io/deluan/navidrome:latest
    # NOTE: no `user:` here — rootless podman maps container root to the host user (uid 1000),
    # which must own the data folder and be able to read the music folder.
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      # Optional: put your config options customization here. Examples:
      # ND_LOGLEVEL: debug
    volumes:
      - "../../data/navidrome/data:/data"
      - "/home/ebits/Music:/music:ro"

