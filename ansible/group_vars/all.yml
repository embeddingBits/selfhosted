---
# Root of the homelab repo on this host.
homelab_root: /srv/homelab

# Git remote used if the repo needs to be cloned from scratch.
repo_url: git@github.com:embeddingBits/selfhosted
repo_version: main

stacks:
  - flatnotes
  - homepage
  - kavita
  - navidrome

podman_packages:
  Archlinux: [podman, podman-compose]
  Debian: [podman, podman-compose]
  RedHat: [podman, podman-compose]

flatnotes_auth_type: password
flatnotes_username: ebits
flatnotes_password: CHANGE_ME
flatnotes_secret_key: CHANGE_ME

logs_tail: 200
